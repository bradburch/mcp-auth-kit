version: 2
updates:
  # npm dependencies — group dev tooling so it lands in one PR per week.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # @types/node is intentionally pinned to the engines floor (Node 22) so the type
      # checker reflects the OLDEST supported runtime. Don't let it drift to a newer major.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint's peer range is still `typescript <6.1.0`, so a TS 7 bump can't
      # install (ERESOLVE). Drop this once typescript-eslint supports TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Keep GitHub Actions (checkout, setup-node, …) current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
